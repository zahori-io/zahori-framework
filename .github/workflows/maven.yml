# ============================================
# DUAL JDK 17/21 CI MATRIX BUILD
# zahori-framework compatibility validation
# ============================================

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ============================================
  # MATRIX BUILD: JDK 17 + JDK 21
  # ============================================
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue other jobs if one fails
      matrix:
        java: ['17', '21']
        include:
          - java: '17'
            sonar: false
            name: 'JDK 17 (Base)'
          - java: '21'
            sonar: true
            name: 'JDK 21 (Full)'

    name: Build (${{ matrix.name }})

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for SonarCloud

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven

    - name: Cache SonarCloud packages
      if: matrix.sonar
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-${{ matrix.java }}-
          ${{ runner.os }}-m2-

    # Verify JDK and profile activation
    - name: Verify Environment
      run: |
        echo "=== JDK Version ==="
        java -version
        echo "=== Maven Version ==="
        mvn -v
        echo "=== Active Profiles ==="
        mvn help:active-profiles -q

    # Build and test
    - name: Build with Maven (JDK ${{ matrix.java }})
      run: |
        mvn -B clean verify \
          -Dmaven.compiler.release=${{ matrix.java }} \
          -DskipTests=false

    # SonarCloud analysis (only JDK 21)
    - name: SonarCloud Analysis
      if: matrix.sonar && github.event_name != 'pull_request'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=zahori-io_zahori-framework

    # Upload test results
    - name: Publish Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: '**/target/surefire-reports/TEST-*.xml'
        check_name: JUnit Report (JDK ${{ matrix.java }})
        fail_on_failure: false

    # Verify class file version
    - name: Verify Bytecode Version
      run: |
        echo "=== Checking compiled class version ==="
        CLASS_FILE=$(find target/classes -name "*.class" | head -1)
        if [ -n "$CLASS_FILE" ]; then
          MAJOR=$(javap -verbose "$CLASS_FILE" 2>/dev/null | grep "major version" | awk '{print $3}')
          echo "Class file major version: $MAJOR"
          if [ "${{ matrix.java }}" = "17" ] && [ "$MAJOR" != "61" ]; then
            echo "WARNING: Expected major version 61 for JDK 17"
          elif [ "${{ matrix.java }}" = "21" ] && [ "$MAJOR" != "65" ]; then
            echo "WARNING: Expected major version 65 for JDK 21"
          else
            echo "Bytecode version OK"
          fi
        fi

  # ============================================
  # CROSS-RUNTIME VALIDATION
  # Compile on 21, run on 17 (verify compatibility)
  # ============================================
  cross-runtime:
    runs-on: ubuntu-latest
    needs: build
    name: Cross-Runtime Validation

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21 (Compile)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compile with JDK 21 targeting 17
      run: |
        mvn -B clean compile \
          -Dmaven.compiler.release=17 \
          -DskipTests=true

    - name: Set up JDK 17 (Runtime)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify classes load on JDK 17
      run: |
        echo "=== Verifying bytecode compatibility ==="
        java -version
        # Verify all classes can be loaded by JDK 17
        find target/classes -name "*.class" -exec javap -v {} \; 2>&1 | head -50
        echo "=== Cross-runtime validation passed ==="
