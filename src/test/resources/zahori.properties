test.key.base=base-value
test.key.overridden=base-value
test.key.wholevar=${PATH}
test.key.wholevar-missing=${ZAHORI_TEST_DEFINITELY_UNSET_VAR_12345}
test.key.embedded={"a":"${PATH}","b":"static"}
test.key.embedded-missing=pre-${ZAHORI_TEST_DEFINITELY_UNSET_VAR_12345}-post

zahori.test.capabilities.add.android.platformName=android
zahori.test.capabilities.add.android.browserName=chrome
zahori.test.capabilities.add.android.appium\:platformVersion=15.0
zahori.test.capabilities.add.android.appium\:deviceName=Test Device
zahori.test.capabilities.add.android.bstack\:options.projectName=Test Project

# Dos grids declarados a la vez, que es como acaba cualquier proyecto que corre en local y en
# la nube: sin filtro, Selenoid recibia bstack:options y BrowserStack recibia selenoid:options.
zahori.test.capabilities.add.selenoid\:options.enableVNC=true
zahori.test.capabilities.add.selenoid\:options.screenResolution=1920x1080x24
zahori.test.capabilities.add.bstack\:options.projectName=Test Project
zahori.test.capabilities.add.otrogrid\:options.algo=valor

# La misma capability declarada para cuatro plataformas a la vez: cada ejecucion debe recibir
# solo la suya, sin comentar y descomentar lineas a mano entre ejecucion y ejecucion.
zahori.test.capabilities.add.windows.bstack\:options.headerParams=solo-windows
zahori.test.capabilities.add.osx.bstack\:options.headerParams=solo-osx
zahori.test.capabilities.add.ios.bstack\:options.headerParams=solo-ios
